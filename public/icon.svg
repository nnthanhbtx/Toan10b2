<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1b4f" />
      <stop offset="70%" stop-color="#020024" />
      <stop offset="100%" stop-color="#010014" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="innerGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Ring (Millionaire styling) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.9" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.5" stroke-dasharray="6,6" />

  <!-- Rays / Compass Star pattern -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.4">
    <line x1="256" y1="40" x2="256" y2="472" />
    <line x1="40" y1="256" x2="472" y2="256" />
    <line x1="103" y1="103" x2="409" y2="409" />
    <line x1="409" y1="103" x2="103" y2="409" />
  </g>

  <!-- Center Glowing Badge -->
  <circle cx="256" cy="256" r="150" fill="#03071e" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6" />

  <!-- Central Dollar & Math Symbol -->
  <text x="256" y="275" font-family="Arial, Helvetica, sans-serif" font-size="140" font-weight="900" fill="url(#innerGold)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">$</text>

  <!-- Subtitle Badge: TOÁN 10 -->
  <rect x="146" y="340" width="220" height="42" rx="21" fill="#1e3a8a" stroke="url(#goldGrad)" stroke-width="3" />
  <text x="256" y="366" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">TOÁN 10</text>
  
  <!-- Top Label: MỆNH ĐỀ -->
  <rect x="166" y="125" width="180" height="34" rx="17" fill="#0f172a" stroke="#60a5fa" stroke-width="2" opacity="0.9" />
  <text x="256" y="147" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="2">MỆNH ĐỀ</text>
</svg>
